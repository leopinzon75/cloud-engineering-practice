name: Integracion Continua - Gateway Diagnostico Automotriz

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código del repositorio
      uses: actions/checkout@v3

    - name: 2. Configurar el entorno de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. Instalar librerías requeridas
      run: |
        python -m pip install --upgrade pip
        pip install flask boto3 moto pytest

    - name: 4. Ejecutar Pruebas Automatizadas
      run: |
        pytest test_app.py --verbose   
