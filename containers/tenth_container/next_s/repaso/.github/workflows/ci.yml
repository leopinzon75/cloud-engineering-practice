name: 🧪 CI - Python Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 1️⃣ Clonar código del repositorio
        uses: actions/checkout@v4

      - name: 2️⃣ Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3️⃣ Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 4️⃣ Ejecutar Pruebas Unitarias
        run: |
          pytest tests/
