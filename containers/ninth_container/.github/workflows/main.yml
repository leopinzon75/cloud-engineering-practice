name: CI/CD Data Pipeline (MinIO + DynamoDB + Docker Hub)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio:RELEASE.2024-01-16T16-07-38Z
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data

      dynamodb:
        image: amazon/dynamodb-local:2.2.1
        ports:
          - 8000:8000
        command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f containers/ninth_container/repaso/next_10/requirements.txt ]; then pip install -r containers/ninth_container/repaso/next_10/requirements.txt; fi

      - name: Run Pytest Suite
        env:
          AWS_ENDPOINT_URL_S3: http://localhost:9000
          AWS_ENDPOINT_URL_DYNAMO: http://localhost:8000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: |
          cd containers/ninth_container/repaso/next_10
          pytest test_app.py -v

      # --- METADATOS Y ETIQUETADO DOCKER ---
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/next10-pipeline
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: containers/ninth_container/repaso/next_10
          file: containers/ninth_container/repaso/next_10/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
