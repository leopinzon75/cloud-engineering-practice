name: CI/CD Pipeline - Telemetry Multi-Cloud App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./containers/ninth_container/repaso/next_9/vers_uno
          file: ./containers/ninth_container/repaso/next_9/vers_uno/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/telemetry-pipeline:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/telemetry-pipeline:${{ github.sha }}
