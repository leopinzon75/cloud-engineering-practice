name: Multi-Cloud Telemetry CI/CD & Docker Hub Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias y validar sintaxis
        run: |
          pip install -r containers/tenth_container/read_me_ocho/requirements.txt
          python -m py_compile containers/tenth_container/read_me_ocho/app.py

      - name: Iniciar sesión en Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar y publicar imagen en Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./containers/tenth_container/read_me_ocho
          file: ./containers/tenth_container/read_me_ocho/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/multicloud-telemetry-processor:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/multicloud-telemetry-processor:${{ github.sha }}
