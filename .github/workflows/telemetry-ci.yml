name: Fleet Multi-Cloud Simulator CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, synchronize]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: containers/ninth_container/repaso/next_8/vers_uno

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11 con Caché de Pip
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: containers/ninth_container/repaso/next_8/vers_uno/requirements.txt

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pruebas Unitarias con Pytest
      run: |
        pytest test_app.py

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Compilar Imagen para Escaneo Local (Sin Push)
      uses: docker/build-push-action@v5
      with:
        context: containers/ninth_container/repaso/next_8/vers_uno
        file: containers/ninth_container/repaso/next_8/vers_uno/Dockerfile
        load: true
        tags: leopinzon75/fleet-multicloud-simulator:scan-target

    - name: DevSecOps — Escaneo de Vulnerabilidades con Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'leopinzon75/fleet-multicloud-simulator:scan-target'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Iniciar sesión en Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Configurar Metadatos y Etiquetado Dinámico
      id: meta
      if: github.event_name == 'push'
      uses: docker/metadata-action@v5
      with:
        images: leopinzon75/fleet-multicloud-simulator
        tags: |
          type=raw,value=latest
          type=sha,format=short

    - name: Publicar Imagen Verificada en Docker Hub
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: containers/ninth_container/repaso/next_8/vers_uno
        file: containers/ninth_container/repaso/next_8/vers_uno/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
