name: Fleet Multi-Cloud Simulator CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: containers/ninth_container/repaso/next_8/vers_uno

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11 con Caché
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: containers/ninth_container/repaso/next_8/vers_uno/requirements.txt

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Pruebas unitarias
      run: |
        pytest test_app.py

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Compilar y Publicar en Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: containers/ninth_container/repaso/next_8/vers_uno
        file: containers/ninth_container/repaso/next_8/vers_uno/Dockerfile
        push: true
        tags: |
          leopinzon75/fleet-multicloud-simulator:latest
          leopinzon75/fleet-multicloud-simulator:v1.0.0
