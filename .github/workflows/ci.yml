name: CI/CD - Read Me Six (Telemetria & Docker)

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v4

    - name: 2. Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Ejecutar Pruebas Automatizadas
      working-directory: ./containers/tenth_container/read_me_six
      run: |
        pytest test_app.py --verbose

    - name: 5. Iniciar Sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 6. Construir y Publicar Imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: ./containers/tenth_container/read_me_six
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/telemetria-service:latest
