name: CI - Read Me Six (Telemetria)

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v3

    - name: 2. Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Ejecutar Pruebas Automatizadas en Subdirectorio
      working-directory: ./containers/tenth_container/read_me_six
      run: |
        pytest test_app.py --verbose
