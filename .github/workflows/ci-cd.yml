# v3.6 - CI/CD Pipeline: Build & Push MinIO S3 App to Docker Hub
name: CI/CD Pipeline - MinIO S3 Diagnostic App

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: containers/ninth_container/repaso/next_3/ver_tres_dos
        run: |
          python -m pip install --upgrade pip
          pip install flask boto3 pytest

      - name: Run Pytest
        working-directory: containers/ninth_container/repaso/next_3/ver_tres_dos
        run: |
          python -m pytest test_app.py -v

  build-and-push:
    name: Build & Push Image to Docker Hub
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: containers/ninth_container/repaso/next_3/ver_tres_dos
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/diagnostic-vault-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/diagnostic-vault-app:v1.0
