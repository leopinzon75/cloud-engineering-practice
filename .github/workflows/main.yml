name: CI/CD Pipeline ver_tres

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r containers/ninth_container/repaso/next_3/ver_tres/requirements.txt

    - name: Ejecutar pruebas con Pytest
      run: |
        cd containers/ninth_container/repaso/next_3/ver_tres
        pytest -v

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Construir y subir imagen
      uses: docker/build-push-action@v4
      with:
        context: ./containers/ninth_container/repaso/next_3/ver_tres
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/p0171-flask-app:latest
